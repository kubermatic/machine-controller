apiVersion: "cluster.k8s.io/v1alpha1"
kind: MachineDeployment
metadata:
  name: << MACHINE_NAME >>
  namespace: kube-system
  annotations:
    k8c.io/operating-system-profile: osp-flatcar-cloud-init
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      name: << MACHINE_NAME >>
  template:
    metadata:
      labels:
        name: << MACHINE_NAME >>
    spec:
      providerSpec:
        value:
          sshPublicKeys:
            - "<< YOUR_PUBLIC_KEY >>"
          cloudProvider: anexia
          # The API token is not part of the cloudProviderSpec, the
          # machine-controller reads it from the ANEXIA_TOKEN environment
          # variable.
          cloudProviderSpec:
            templateID: "<< ANEXIA_TEMPLATE_ID >>"
            locationID: "<< ANEXIA_LOCATION_ID >>"
            cpus: 2
            cpuPerformanceType: performance
            memory: 2048
            diskSize: 60
            diskPerformanceType: ENT6
            networks:
              - vlan: "<< ANEXIA_VLAN_ID >>"
                prefixes:
                  - "<< ANEXIA_PREFIX_ID >>"
          operatingSystem: "<< OS_NAME >>"
          operatingSystemSpec:
            provisioningUtility: "cloud-init"
            distUpgradeOnBoot: false
            disableAutoUpdate: true
      versions:
        kubelet: "<< KUBERNETES_VERSION >>"
